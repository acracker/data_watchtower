[project]
name = "data-watchtower"
version = "0.0.5"
description = "Data quality inspection tool. Identify issues before your CTO detects them!"
authors = [
    { name = "acracker", email = "acracker@163.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "attrs==26.1.0",
    "peewee==4.0.4",
    "shortuuid==1.0.13",
    "tornado==6.5.5",
    "polars==1.39.3",
    "pyarrow==23.0.1",
    "connectorx==0.4.5",
    "apischema==0.19.0",
    "arrow==1.4.0",
    "faker==18.13.0",
    "iniconfig==2.3.0",
    "packaging==26.0",
    "pluggy==1.6.0",
    "polars-runtime-32==1.39.3",
    "psycopg2-binary==2.9.11",
    "pygments==2.20.0",
    "pymysql==1.1.2",
    "six==1.17.0",
]

[dependency-groups]
dev = [
    "faker==18.13.0",
    "pytest>=8.2.0,<9.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "pymysql>=1.1.0,<2.0.0",
]

[project.urls]
Repository = "https://github.com/acracker/data_watchtower"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "tsinghua"
url = "https://mirrors.cloud.tencent.com/pypi/simple/"
default = true
