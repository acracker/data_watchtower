[project]
name = "data-watchtower"
version = "0.0.6"
description = "Data quality inspection tool. Identify issues before your CTO detects them!"
authors = [
    { name = "acracker", email = "acracker@163.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "attrs>23.0.0",
    "peewee>=3.17.1",
    "shortuuid>=1.0.13",
    "tornado>=6.4.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "connectorx>=0.3.0",
    "apischema>=0.15.0",
    "arrow>=0.7.0",
    "duckdb>=1.5.2",
    "filelock>=3.13.0",
]

[dependency-groups]
dev = [
    "flake8",
    "faker",
    "pytest>=8.2.0,<9.0.0",
    "psycopg2-binary>=2.9.9",
    "pymysql>=1.1.0",
]

[project.urls]
Repository = "https://github.com/acracker/data_watchtower"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "tsinghua"
url = "https://mirrors.cloud.tencent.com/pypi/simple/"
default = true
